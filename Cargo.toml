[package]
name = "nj"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bitflags = "2.13.1"
crossterm = { version = "0.29.0", features = ["osc52"] }
ropey = { version = "2.0.0-beta.1", default-features = false, features = ["simd", "metric_lines_lf"] }
rustix = { version = "1.1.4", features = ["stdio", "process"] }
# Already in the tree through crossterm; the sandbox binary uses it to leave
# cleanly on Ctrl+C.
signal-hook = "0.3.18"
tree-sitter = "0.27"
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
# From its repository: crates.io has only 0.1.0, which reads a line taken
# away that starts with `--` as a file's name and an error.
tree-sitter-diff = { git = "https://github.com/the-mikedavis/tree-sitter-diff", rev = "ada384ac7bfc1307f32de474620120add29998fb", optional = true }
tree-sitter-go ={ version = "0.25", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-javascript ={ version = "0.25", optional = true }
tree-sitter-json ={ version = "0.24", optional = true }
tree-sitter-make = { version = "1.1", optional = true }
tree-sitter-md = { version = "0.5", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-scss = { version = "1.0", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

# One feature per grammar linked into the binary. A language left out is
# still detected and indented, just not highlighted.
[features]
default = ["c", "cpp", "css", "diff", "go", "html", "javascript", "json", "makefile", "markdown", "python", "rust", "scss", "shell", "toml", "typescript", "yaml"]
c = ["dep:tree-sitter-c"]
cpp = ["dep:tree-sitter-cpp"]
css = ["dep:tree-sitter-css"]
diff = ["dep:tree-sitter-diff"]
go =["dep:tree-sitter-go"]
html = ["dep:tree-sitter-html"]
javascript = ["dep:tree-sitter-javascript"]
json = ["dep:tree-sitter-json"]
makefile = ["dep:tree-sitter-make"]
markdown = ["dep:tree-sitter-md"]
python = ["dep:tree-sitter-python"]
rust = ["dep:tree-sitter-rust"]
scss = ["dep:tree-sitter-scss"]
shell = ["dep:tree-sitter-bash"]
toml = ["dep:tree-sitter-toml-ng"]
# Both TypeScript and TSX, the two grammars of one crate.
typescript = ["dep:tree-sitter-typescript"]
yaml = ["dep:tree-sitter-yaml"]

# Scenarios run one after another with their own `main` (ADR 25): a run owns
# the process's working directory, and the filter after `--` is a file name.
[[test]]
name = "scenarios"
harness = false

# The highlight queries checked against examples, a file at a time.
[[test]]
name = "highlights"
harness = false
